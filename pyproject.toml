[project]
name = "mini-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "terry-ggtt", email = "tingruigu1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "tavily-python>=0.8.0",
]

[project.scripts]
mini-research-agent = "mini_research_agent.cli:main"
mini-research-ingest = "mini_research_agent.scripts.ingest:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
